name: Skills Hub Guard

on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'vendor/skills-hub'
      - 'agents/skill-registry/**'
      - 'agents/skill-extractor/**'
      - 'skills/**'
      - 'scripts/skills-hub-guard.mjs'
      - 'scripts/init-skills-hub-source.sh'
      - 'scripts/submit-skill-candidate.mjs'
      - 'scripts/deploy-preflight.mjs'
      - 'docs/SKILLS_HUB_*'
      - 'docs/ASTRA_SKILL_FACTORY.md'
      - 'src/worker.ts'
      - 'src/worker-skills.ts'
      - 'src/worker-auto-extractor.ts'
      - 'db/schema.sql'
      - 'public/index.html'
      - 'public/skills.html'
      - 'wrangler.toml'
      - '.github/workflows/skills-hub-guard.yml'
      - 'package.json'
  push:
    branches:
      - main
      - 'integration/skills-hub-*'
      - 'integration/astra-skill-factory-*'
      - 'integration/skill-auto-extractor-*'
    paths:
      - '.gitmodules'
      - 'vendor/skills-hub'
      - 'agents/skill-registry/**'
      - 'agents/skill-extractor/**'
      - 'skills/**'
      - 'scripts/skills-hub-guard.mjs'
      - 'scripts/init-skills-hub-source.sh'
      - 'scripts/submit-skill-candidate.mjs'
      - 'scripts/deploy-preflight.mjs'
      - 'docs/SKILLS_HUB_*'
      - 'docs/ASTRA_SKILL_FACTORY.md'
      - 'src/worker.ts'
      - 'src/worker-skills.ts'
      - 'src/worker-auto-extractor.ts'
      - 'db/schema.sql'
      - 'public/index.html'
      - 'public/skills.html'
      - 'wrangler.toml'
      - '.github/workflows/skills-hub-guard.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without executing submodule code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Skills Hub policy, registry, and pinned gitlink
        run: node scripts/skills-hub-guard.mjs

      - name: Syntax-check registry guard
        run: node --check scripts/skills-hub-guard.mjs

      - name: Syntax-check candidate submit helper
        run: node --check scripts/submit-skill-candidate.mjs

      - name: Syntax-check deploy preflight
        run: node --check scripts/deploy-preflight.mjs

      - name: Validate safe committed deployment defaults
        run: node scripts/deploy-preflight.mjs --ci

      - name: Syntax-check safe initializer
        run: bash -n scripts/init-skills-hub-source.sh
