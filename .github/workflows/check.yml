name: check
on:
  push:
  pull_request:
# จำกัด GITHUB_TOKEN ให้อ่านอย่างเดียว เพื่อลดความเสียหายถ้ามีโค้ดแปลกปลอมรันใน workflow
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
